# Digest rules (same rubric as tests/fixtures/scenarios/_shared) plus contract-probe answers.
- name: digest-classifier
  match: {schemaTitle: DigestBatch}
  respond:
    perEvidence:
      arrayField: items
      item: {ref: "{ref}", priority: low, reason: "Routine or informational message", nextAction: "No action needed", uncertain: false}
      overrides:
        - when: {contains: ["outage", "is down", "security alert", "payment failed"]}
          set: {priority: urgent, reason: "Service, security, or payment incident", nextAction: "Investigate now"}
        - when: {contains: ["maybe", "not sure"]}
          set: {priority: important, uncertain: true, reason: "Unclear request", nextAction: "Read and decide"}
        - when: {contains: ["deadline", "invoice", "meeting", "please review", "contract"]}
          set: {priority: important, reason: "Needs your attention soon", nextAction: "Reply or schedule time today"}
- name: probe-structured
  match: {schemaTitle: ProbeAnswer}
  respond: {json: {answer: pong}}
- name: probe-pong
  match: {contains: [pong]}
  respond: {text: pong}
