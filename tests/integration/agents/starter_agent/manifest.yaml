apiVersion: crewquarters/v1alpha1
kind: Agent
metadata:
  id: starter-agent
  name: Starter Agent
  version: 0.1.0
  summary: Integration-test agent that starts other agents.
  description: Integration-test agent that starts the runs listed in its configuration.
spec:
  image: localhost:5001/crewquarters/starter-agent@sha256:REQUIRED_DIGEST
  entrypoint: ["python", "-m", "starter_agent"]
  architectures: ["linux/amd64", "linux/arm64"]
  triggers: ["manual", "agent"]
  permissions:
    llmProfiles: []
    knowledge: []
    connectors: {}
    cloudProviders: []
    startsAgents: ["worker-agent"]
    userInput: false
  resources:
    cpu: 0.5
    memoryMb: 256
    activeTimeoutSeconds: 120
    maxInputWaitSeconds: 0
  configurationSchema:
    type: object
    properties:
      starts:
        type: array
        default: []
        items: {type: object}
