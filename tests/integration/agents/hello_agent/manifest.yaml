apiVersion: crewquarters/v1alpha1
kind: Agent
metadata:
  id: hello-agent
  name: Hello Agent
  version: 0.1.0
  summary: Minimal integration-test agent that asks one question.
  description: Minimal integration-test agent that asks one question.
spec:
  image: localhost:5001/crewquarters/hello-agent@sha256:REQUIRED_DIGEST
  entrypoint: ["python", "-m", "hello_agent"]
  architectures: ["linux/amd64", "linux/arm64"]
  triggers: ["manual", "schedule"]
  permissions:
    llmProfiles: []
    knowledge: []
    connectors: {}
    cloudProviders: []
    userInput: true
  resources:
    cpu: 0.5
    memoryMb: 256
    activeTimeoutSeconds: 120
    maxInputWaitSeconds: 600
  configurationSchema:
    type: object
    properties:
      greeting:
        type: string
        default: hello
