[project]
name = "crewquarters-fake"
version = "0.1.0"
description = "Crewquarters fake platform for development and tests: broker, control-API slice, mock providers, launchers"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "crewquarters-shared",
    "crewquarters-sdk",
    "crewquarters-speech",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "click>=8.1",
    "tzdata>=2024.1",
    # Voice calls through a local LiveKit server (imported only when one is configured).
    "livekit==1.1.18",
    "livekit-api==1.2.1",
]

[project.scripts]
crewq-fake = "crewquarters_fake.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_fake"]

[tool.uv.sources]
crewquarters-shared = { workspace = true }
crewquarters-sdk = { workspace = true }
crewquarters-speech = { workspace = true }
