[project]
name = "crewquarters-secret-store"
version = "0.1.0"
description = "Envelope encryption of provider secrets under the device master key"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography>=43.0", "crewquarters-shared"]

[tool.uv.sources]
crewquarters-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_secret_store"]
