[project]
name = "crewquarters-crewctl"
version = "0.1.0"
description = "crewctl: scaffold, validate, test, build, and locally publish Crewquarters agents"
requires-python = ">=3.12"
dependencies = [
    "crewquarters-contracts",
    "crewquarters-fake",
    "click>=8.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
crewctl = "crewctl.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewctl"]

[tool.uv.sources]
crewquarters-contracts = { workspace = true }
crewquarters-fake = { workspace = true }
