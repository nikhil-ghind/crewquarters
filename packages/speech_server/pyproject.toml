[project]
name = "crewquarters-speech"
version = "0.1.0"
description = "Crewquarters speech server: OpenAI-compatible speech-to-text and text-to-speech on local models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.17",
    "numpy>=1.26",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The real engine. Wheels exist for linux/arm64 (GB10), linux/amd64, and macOS arm64.
# sherpa-onnx-core carries the ONNX runtime; it is listed explicitly because some sherpa-onnx
# wheels omit it from their metadata (the uv 0.5.11 lock then drops it).
sherpa = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8"]

[project.scripts]
crewq-speech = "crewquarters_speech.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_speech"]
