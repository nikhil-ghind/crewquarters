[project]
name = "crewquarters-shared"
version = "0.1.0"
description = "Crewquarters platform core: database models, job queue, run lifecycle, and shared utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "croniter>=5.0",
    "pyjwt>=2.10",
    "pyyaml>=6.0",
    "tzdata>=2024.2",
    "httpx>=0.27",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_shared"]
