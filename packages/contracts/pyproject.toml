[project]
name = "crewquarters-contracts"
version = "0.1.0a1"
description = "DRAFT v1alpha1 Crewquarters contracts (manifest schema, capabilities, broker/control OpenAPI, run events) and shared validation helpers"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"agent-manifest.schema.json" = "crewquarters_contracts/data/agent-manifest.schema.json"
"capabilities.yaml" = "crewquarters_contracts/data/capabilities.yaml"
"broker-sdk.openapi.yaml" = "crewquarters_contracts/data/broker-sdk.openapi.yaml"
"openapi.yaml" = "crewquarters_contracts/data/openapi.yaml"
"events/run-event.schema.json" = "crewquarters_contracts/data/events/run-event.schema.json"
