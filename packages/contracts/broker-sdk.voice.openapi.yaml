# Draft: voice calls and the OpenAI-compatible model facade (docs/voice/README.md, D24).
openapi: 3.1.0
info:
  title: 'Crewquarters broker SDK API: voice calls and the model facade (draft)'
  version: v1alpha1
  x-status: draft
  x-drafted-by: Person 5
  description: Proposed additions to broker-sdk.openapi.yaml (decision D24), not yet served by services/capability_broker.
    The fake platform serves them on top of the stable contract; $refs to shared components resolve against
    broker-sdk.openapi.yaml. When Person 3 adopts them, move these paths and schemas into that file.
paths:
  /voice/calls:
    post:
      operationId: createVoiceCall
      x-capability: sip.call.conversational
      x-idempotent: with-idempotency-key
      x-fault-target: broker.voice.create
      description: 'Dial a phone number through the owner''s SIP trunk (self-hosted LiveKit SIP) into
        a new

        LiveKit room, and return a room token the agent uses to hold the conversation. The same

        idempotencyKey returns the existing call. The broker, not the agent, holds the LiveKit and

        trunk credentials.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCallCreate'
      responses:
        '200':
          description: The call for this idempotencyKey (existing or newly dialed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceCall'
        default:
          $ref: '#/components/responses/Error'
  /voice/calls/{id}:
    get:
      operationId: getVoiceCall
      x-capability: sip.call.conversational
      x-idempotent: true
      x-fault-target: broker.voice.get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current call state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceCall'
        default:
          $ref: '#/components/responses/Error'
  /voice/calls/{id}/hangup:
    post:
      operationId: hangupVoiceCall
      x-capability: sip.call.conversational
      x-idempotent: true
      x-fault-target: broker.voice.hangup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The call after hanging up (a finished call is returned unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceCall'
        default:
          $ref: '#/components/responses/Error'
  /openai/v1/models:
    get:
      operationId: openaiListModels
      x-capability: null
      x-idempotent: true
      x-fault-target: broker.openai.models
      description: The profile variants this run may use (OpenAI's model list shape).
      responses:
        '200':
          description: The run's granted model profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelList'
        default:
          $ref: '#/components/responses/Error'
  /openai/v1/chat/completions:
    post:
      operationId: openaiChatCompletions
      x-capability: llm.profile:<variant> (and cloud.<provider> for cloud profiles)
      x-idempotent: false
      x-fault-target: broker.openai.chat
      description: 'OpenAI-compatible chat completions for clients such as the LiveKit OpenAI plugin.
        The API

        key is the run token and `model` is a bound profile variant (for example

        local.general.small). `stream: true` answers with server-sent events in OpenAI''s chunk

        format, ending with `data: [DONE]`. Unlike /llm/chat, `tools` are passed to the model

        (voice agents end calls with a tool).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatRequest'
      responses:
        '200':
          description: A chat.completion object, or an SSE stream of chat.completion.chunk objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIChatCompletion'
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /openai/v1/audio/transcriptions:
    post:
      operationId: openaiTranscriptions
      x-capability: llm.profile:<variant> (a local.stt.* profile)
      x-idempotent: true
      x-fault-target: broker.openai.transcriptions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpenAITranscriptionRequest'
      responses:
        '200':
          description: The transcript of one utterance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAITranscription'
        default:
          $ref: '#/components/responses/Error'
  /openai/v1/audio/speech:
    post:
      operationId: openaiSpeech
      x-capability: llm.profile:<variant> (a local.tts.* profile)
      x-idempotent: true
      x-fault-target: broker.openai.speech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAISpeechRequest'
      responses:
        '200':
          description: 'Audio streamed as it is synthesized: `pcm` is signed 16-bit little-endian mono
            at

            24000 Hz; `wav` is the same with a WAV header.

            '
          content:
            audio/pcm:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    VoiceCallCreate:
      type: object
      required:
      - to
      - idempotencyKey
      properties:
        to:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
        ringTimeoutSeconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 30
        maxDurationSeconds:
          type: integer
          minimum: 30
          maximum: 1800
          default: 300
    VoiceRoom:
      description: Where and as whom the agent joins the call. The token grants only this room.
      type: object
      required:
      - url
      - name
      - token
      - identity
      properties:
        url:
          type: string
          description: LiveKit WebSocket URL reachable from the agent's network.
        name:
          type: string
        token:
          type: string
          description: 'LiveKit access token: join, publish, subscribe; short-lived.'
        identity:
          type: string
    VoiceCall:
      type: object
      required:
      - id
      - idempotencyKey
      - toMasked
      - state
      - room
      - calleeIdentity
      - answeredAt
      - endedAt
      - durationSeconds
      - errorCode
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        toMasked:
          type: string
          description: Last four digits only; the full number is never returned.
        state:
          enum:
          - dialing
          - ringing
          - answered
          - completed
          - busy
          - no-answer
          - failed
          - canceled
        room:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VoiceRoom'
        calleeIdentity:
          type:
          - string
          - 'null'
        answeredAt:
          type:
          - string
          - 'null'
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 0
        errorCode:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OpenAIChatRequest:
      description: The subset of OpenAI's chat completions request the platform honours.
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: A bound profile variant.
        messages:
          type: array
          minItems: 1
          items:
            type: object
        stream:
          type: boolean
          default: false
        temperature:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 2
        max_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
        max_completion_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
        tools:
          type: array
          items:
            type: object
        tool_choice: {}
        response_format:
          type: object
    OpenAIChatCompletion:
      type: object
      required:
      - id
      - object
      - model
      - choices
      properties:
        id:
          type: string
        object:
          const: chat.completion
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object
    OpenAITranscriptionRequest:
      type: object
      required:
      - file
      - model
      properties:
        file:
          type: string
          format: binary
          description: WAV (16-bit PCM, any sample rate), one utterance.
        model:
          type: string
        language:
          type: string
        response_format:
          enum:
          - json
          - text
          default: json
    OpenAITranscription:
      type: object
      required:
      - text
      properties:
        text:
          type: string
    OpenAISpeechRequest:
      type: object
      required:
      - model
      - input
      properties:
        model:
          type: string
        input:
          type: string
          minLength: 1
          maxLength: 4000
        voice:
          type: string
        response_format:
          enum:
          - pcm
          - wav
          default: pcm
        speed:
          type: number
          minimum: 0.5
          maximum: 2.0
          default: 1.0
    OpenAIModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            type: object
            required:
            - id
            - object
            properties:
              id:
                type: string
              object:
                const: model
              owned_by:
                type: string
