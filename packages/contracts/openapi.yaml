components:
  schemas:
    ActionClaimIn:
      properties:
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
        claimToken:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 8
          - type: 'null'
          title: Claimtoken
          description: Random per claim() call, reused on its retries. A repeat with the same token from
            the same attempt returns the original result.
      type: object
      required:
      - attempt
      title: ActionClaimIn
    ActionCompleteIn:
      properties:
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
        result:
          title: Result
      type: object
      required:
      - attempt
      title: ActionCompleteIn
    ActionOut:
      properties:
        key:
          type: string
          title: Key
        status:
          type: string
          enum:
          - claimed
          - completed
          - in_doubt
          title: Status
        result:
          title: Result
      type: object
      required:
      - key
      - status
      title: ActionOut
    AgentEventIn:
      properties:
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
        type:
          type: string
          enum:
          - run.log
          - run.progress
          - run.metric
          - run.artifact
          title: Type
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - attempt
      - type
      - payload
      title: AgentEventIn
    AgentVersionOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        version:
          type: string
          title: Version
        image:
          type: string
          title: Image
        imageDigest:
          type: string
          title: Imagedigest
        sdkProtocol:
          type: string
          title: Sdkprotocol
        architectures:
          items:
            type: string
          type: array
          title: Architectures
        triggers:
          items:
            type: string
          type: array
          title: Triggers
        permissions:
          additionalProperties: true
          type: object
          title: Permissions
        resources:
          additionalProperties: true
          type: object
          title: Resources
        configurationSchema:
          additionalProperties: true
          type: object
          title: Configurationschema
        resultSchema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Resultschema
        compatible:
          type: boolean
          title: Compatible
        compatibilityIssues:
          items:
            type: string
          type: array
          title: Compatibilityissues
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - version
      - image
      - imageDigest
      - sdkProtocol
      - architectures
      - triggers
      - permissions
      - resources
      - configurationSchema
      - resultSchema
      - compatible
      - compatibilityIssues
      - createdAt
      title: AgentVersionOut
    AskIn:
      properties:
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
        key:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          title: Key
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        prompt:
          type: string
          maxLength: 4000
          minLength: 1
          title: Prompt
        schema:
          additionalProperties: true
          type: object
          title: Schema
        timeoutSeconds:
          type: integer
          maximum: 86400.0
          minimum: 1.0
          title: Timeoutseconds
        preview:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preview
      type: object
      required:
      - attempt
      - key
      - title
      - prompt
      - schema
      - timeoutSeconds
      title: AskIn
    AttemptIn:
      properties:
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
      type: object
      required:
      - attempt
      title: AttemptIn
    AttentionItem:
      properties:
        kind:
          type: string
          enum:
          - input_request
          - failed_run
          - schedule_blocked
          - model_action
          title: Kind
        title:
          type: string
          title: Title
        detail:
          type: string
