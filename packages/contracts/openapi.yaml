    SettingsOut:
      properties:
        timezone:
          type: string
          title: Timezone
        idleUnloadSeconds:
          type: integer
          title: Idleunloadseconds
        callbackBaseUrl:
          type: string
          title: Callbackbaseurl
          description: 'Read-only: set by CQ_PUBLIC_BASE_URL, the origin the owner''s browser uses. The
            capability broker builds the Google OAuth redirect from it, and the Twilio callbacks too unless
            CQ_TWILIO_CALLBACK_BASE_URL is set.'
        callbackUrls:
          additionalProperties:
            type: string
          type: object
          title: Callbackurls
          description: 'Exact URLs to register: googleRedirectUri (from CQ_PUBLIC_BASE_URL) and twilioCallbackBase
            (from CQ_TWILIO_CALLBACK_BASE_URL, else CQ_PUBLIC_BASE_URL).'
        setupCompleted:
          type: boolean
          title: Setupcompleted
        setupState:
          additionalProperties: true
          type: object
          title: Setupstate
          description: Server-side first-run wizard progress (resumes after refresh/OAuth).
        versions:
          additionalProperties:
            type: integer
          type: object
          title: Versions
          description: Per-setting version for optimistic updates.
      type: object
      required:
      - timezone
      - idleUnloadSeconds
      - callbackBaseUrl
      - callbackUrls
      - setupCompleted
      - setupState
      - versions
