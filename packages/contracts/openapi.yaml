    SettingsPatchIn:
      properties:
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
        idleUnloadSeconds:
          anyOf:
          - type: integer
            maximum: 86400.0
            minimum: 60.0
          - type: 'null'
          title: Idleunloadseconds
        callbackBaseUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Callbackbaseurl
          description: Read-only; set CQ_PUBLIC_BASE_URL instead. Sending it returns 422 SETTING_READ_ONLY.
          deprecated: true
        setupCompleted:
          anyOf:
          - type: boolean
          - type: 'null'
