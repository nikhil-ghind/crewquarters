# Trivy secret-scanner configuration for built artifacts (infra/scripts/scan_secrets.sh and
# the image-security CI job): the allowlist for known test fixtures.
#
# It is empty: as of 2026-09-25 no shipped artifact (.deb, offline-bundle manifest and SBOMs,
# the five images on amd64/arm64, the web UI bundle) contains a finding. Test fixtures
# (tests/, fake-platform scenarios) are not copied into any image or package.
#
# A new entry needs review by the security owner (Person 3) and must say why the match is not
# a secret, e.g.:
#   - id: twilio-doc-vector
#     description: Twilio's published signature test vector, test data only
#     regex: <exact fixture value>
#     path: .*/tests/fixtures/.*
allow-rules: []
