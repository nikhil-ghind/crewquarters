# Crewquarters edge proxy in LAN HTTPS mode (PLAN.md sections 10.1 and 14;
# docs/runbooks/lan-https.md). `crewquarters lan-https enable` selects this file through
# infra/compose/compose.lan-https.yaml, which also mounts the device certificate from
# /etc/crewquarters/tls at /run/crewquarters-tls and publishes 443 -> 8443.
#
#   :8443  main site over TLS (host port 443)   the same routes as the default mode
#   :8080  HTTP (host CQ_HTTP_PORT, 80)         301 to https://<same host>/..., except
#                                               /crewquarters-ca.crt (the device CA, so a
#                                               phone can fetch it before trusting it)
#   :8081  callbacks site                       unchanged (the tunnel terminates TLS)

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/cq/common.conf;

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/cq/tls.conf;
        include /etc/nginx/cq/ca-download.conf;
        include /etc/nginx/cq/main-site.conf;
    }

    server {
        listen 8080;
        server_name _;
        include /etc/nginx/cq/security-headers.conf;
        include /etc/nginx/cq/json-errors.conf;
        include /etc/nginx/cq/ca-download.conf;

        # The host port is 443, so the redirect keeps the host name and drops the port.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    include /etc/nginx/cq/callbacks-site.conf;
}
