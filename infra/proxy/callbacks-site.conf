# Port 8081: ONLY the Google OAuth and Twilio callback paths. Not published; the
# `callbacks` Compose profile's tunnel reaches it on the `callbacks` network. The same in
# both modes (the tunnel terminates TLS). Included inside the http {} block.
server {
    listen 8081;
    server_name _;
    set $broker http://capability-broker:8000;

    include /etc/nginx/cq/security-headers.conf;
    include /etc/nginx/cq/json-errors.conf;

    location = /api/v1/connections/google/callback {
        limit_req zone=callbacks burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass $broker;
    }
    location ^~ /api/v1/callbacks/twilio/ {
        limit_req zone=callbacks burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass $broker;
    }
    location / {
        return 404;
    }
}
