# http-level settings shared by nginx.conf (default, HTTP on localhost) and
# nginx-lan-https.conf (LAN HTTPS mode). Included inside the http {} block.

client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;
sendfile on;
keepalive_timeout 65;

# Docker's embedded DNS; re-resolve so restarted containers are found.
resolver 127.0.0.11 valid=10s ipv6=off;

# A caller-supplied X-Request-Id is kept only when it is sane; otherwise nginx makes one.
map $http_x_request_id $cq_request_id {
    "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
    default $request_id;
}

# HSTS only over HTTPS, which only LAN HTTPS mode serves; an empty value sends no header.
# Never for localhost or an IP address: a remembered HSTS entry for localhost would break
# http://localhost:8080 after `crewquarters lan-https disable`.
map "$scheme:$host" $cq_hsts {
    "~^https:(localhost|[0-9.]+|\[[0-9a-fA-F:]+\])$" "";
    "~^https:" "max-age=31536000";
    default "";
}

# The port the browser used: the container's TLS port 8443 is published as 443.
map $server_port $cq_public_port {
    8443 443;
    default $server_port;
}

# Access log without query strings or referrers: OAuth codes, tokens and phone
# numbers travel in them (PLAN.md section 10.2).
log_format cq escape=json
    '{"time":"$time_iso8601","service":"proxy","site":"$server_port",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"durationSeconds":$request_time,'
    '"requestId":"$cq_request_id"}';
access_log /dev/stdout cq;

# Default body limit; larger only for knowledge uploads (main-site.conf).
client_max_body_size 2m;

# Callbacks come from Google/Twilio (or the tunnel): generous but bounded.
limit_req_zone $binary_remote_addr zone=callbacks:10m rate=20r/s;
limit_req_status 429;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
# The proxy is the edge: inbound X-Forwarded-* values are replaced, never appended.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $cq_public_port;
proxy_set_header Forwarded "";
proxy_set_header X-Request-Id $cq_request_id;
# Server-sent events (run events, chat, model state) must not be buffered.
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 5m;
proxy_connect_timeout 5s;
# The edge sets these itself (security-headers.conf).
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
