# Crewquarters edge proxy: the only published HTTP entry (PLAN.md sections 4.1, 4.2, 14.3).
# Routing table and callback exposure: docs/runbooks/proxy.md.
#
#   :8080  main site (published)   UI (SPA), /api/* -> control API, callbacks -> broker,
#                                  /internal/* -> 404
#   :8081  callbacks site          ONLY the Google OAuth and Twilio callback paths; the
#                                  `callbacks` Compose profile's tunnel points here
#
# Upstream names resolve at request time through Docker's DNS, so the proxy starts (and
# serves the UI) even while a backend is still starting or restarting.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS; re-resolve so restarted containers are found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A caller-supplied X-Request-Id is kept only when it is sane; otherwise nginx makes one.
    map $http_x_request_id $cq_request_id {
        "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
        default $request_id;
    }

    # Access log without query strings or referrers: OAuth codes, tokens and phone
    # numbers travel in them (PLAN.md section 10.2).
    log_format cq escape=json
        '{"time":"$time_iso8601","service":"proxy","site":"$server_port",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"durationSeconds":$request_time,'
        '"requestId":"$cq_request_id"}';
    access_log /dev/stdout cq;

    # Default body limit; larger only for knowledge uploads (below).
    client_max_body_size 2m;

    # Callbacks come from Google/Twilio (or the tunnel): generous but bounded.
    limit_req_zone $binary_remote_addr zone=callbacks:10m rate=20r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # The proxy is the edge: inbound X-Forwarded-* values are replaced, never appended.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-Id $cq_request_id;
    # Server-sent events (run events, chat, model state) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 5m;
    proxy_connect_timeout 5s;
    # The edge sets these itself (security-headers.conf).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;

    server {
        listen 8080;
        server_name _;
        root /usr/share/crewquarters/ui;
        set $control_api http://control-api:8080;
        set $broker http://capability-broker:8000;

        include /etc/nginx/cq/security-headers.conf;
        include /etc/nginx/cq/json-errors.conf;

        # Service-to-service routes never cross the edge.
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }

        # Broker-owned public callbacks (PLAN.md section 4.1): exactly two groups.
        location = /api/v1/connections/google/callback {
            limit_req zone=callbacks burst=40 nodelay;
            client_max_body_size 64k;
            proxy_pass $broker;
        }
        location ^~ /api/v1/callbacks/twilio/ {
            limit_req zone=callbacks burst=40 nodelay;
            client_max_body_size 64k;
            proxy_pass $broker;
        }

        # Everything else under /api/ (including the rest of /api/v1/connections/*) is the
        # control API's.
        location ^~ /api/ {
            proxy_pass $control_api;

            # Knowledge document uploads (POST /api/v1/knowledge-bases/{id}/documents):
            # CQ_MAX_UPLOAD_BYTES (25 MiB) plus multipart overhead, streamed to the control
            # API (which enforces the exact limit) rather than buffered here. Raise this
            # together with CQ_MAX_UPLOAD_BYTES.
            location ~ ^/api/v1/knowledge-bases/[^/]+/documents/?$ {
                client_max_body_size 26m;
                proxy_request_buffering off;
                proxy_pass $control_api;
            }
        }

        # Hashed build assets never change.
        location ^~ /assets/ {
            include /etc/nginx/cq/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/cq/security-headers.conf;
            include /etc/nginx/cq/ui-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Single-page app: unknown non-API paths (e.g. /setup) serve index.html.
        location / {
            include /etc/nginx/cq/security-headers.conf;
            include /etc/nginx/cq/ui-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }

    server {
        listen 8081;
        server_name _;
        set $broker http://capability-broker:8000;

        include /etc/nginx/cq/security-headers.conf;
        include /etc/nginx/cq/json-errors.conf;

        location = /api/v1/connections/google/callback {
            limit_req zone=callbacks burst=40 nodelay;
            client_max_body_size 64k;
            proxy_pass $broker;
        }
        location ^~ /api/v1/callbacks/twilio/ {
            limit_req zone=callbacks burst=40 nodelay;
            client_max_body_size 64k;
            proxy_pass $broker;
        }
        location / {
            return 404;
        }
    }
}
