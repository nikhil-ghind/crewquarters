# Crewquarters edge proxy: the only published HTTP entry (PLAN.md sections 4.1, 4.2, 14.3).
# Routing table and callback exposure: docs/runbooks/proxy.md. This is the default mode;
# LAN HTTPS mode runs nginx-lan-https.conf instead (docs/runbooks/lan-https.md).
#
#   :8080  main site (published)   UI (SPA), /api/* -> control API, callbacks -> broker,
#                                  /internal/* -> 404
#   :8081  callbacks site          ONLY the Google OAuth and Twilio callback paths; the
#                                  `callbacks` Compose profile's tunnel points here
#
# Upstream names resolve at request time through Docker's DNS, so the proxy starts (and
# serves the UI) even while a backend is still starting or restarting.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/cq/common.conf;

    server {
        listen 8080;
        server_name _;
        include /etc/nginx/cq/main-site.conf;
    }

    include /etc/nginx/cq/callbacks-site.conf;
}
