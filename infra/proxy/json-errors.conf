# Errors the proxy itself produces use the platform envelope (PLAN.md section 4.3).
# Upstream error responses pass through unchanged (proxy_intercept_errors is off).
error_page 404 @cq_not_found;
error_page 413 @cq_too_large;
error_page 429 @cq_rate_limited;
error_page 502 503 504 =503 @cq_unavailable;

location @cq_not_found {
    include /etc/nginx/cq/security-headers.conf;
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Not found.","requestId":"$cq_request_id","details":{}}}\n';
}
location @cq_too_large {
    include /etc/nginx/cq/security-headers.conf;
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body too large.","requestId":"$cq_request_id","details":{}}}\n';
}
location @cq_rate_limited {
    include /etc/nginx/cq/security-headers.conf;
    add_header Retry-After "1" always;
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests.","requestId":"$cq_request_id","details":{"retryAfterSeconds":1}}}\n';
}
location @cq_unavailable {
    include /etc/nginx/cq/security-headers.conf;
    default_type application/json;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is starting or unavailable. Try again shortly.","requestId":"$cq_request_id","details":{}}}\n';
}
