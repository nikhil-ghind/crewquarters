# The main site: web UI (SPA), /api/* -> control API, the two callback groups -> broker,
# /internal/* -> 404. Included inside a server {} block: port 8080 by default, port 8443
# (TLS) in LAN HTTPS mode. Routing table: docs/runbooks/proxy.md.

root /usr/share/crewquarters/ui;
set $control_api http://control-api:8080;
set $broker http://capability-broker:8000;

include /etc/nginx/cq/security-headers.conf;
include /etc/nginx/cq/json-errors.conf;

# Service-to-service routes never cross the edge.
location = /internal { return 404; }
location ^~ /internal/ { return 404; }

# Broker-owned public callbacks (PLAN.md section 4.1): exactly two groups.
location = /api/v1/connections/google/callback {
    limit_req zone=callbacks burst=40 nodelay;
    client_max_body_size 64k;
    proxy_pass $broker;
}
location ^~ /api/v1/callbacks/twilio/ {
    limit_req zone=callbacks burst=40 nodelay;
    client_max_body_size 64k;
    proxy_pass $broker;
}

# Everything else under /api/ (including the rest of /api/v1/connections/*) is the
# control API's.
location ^~ /api/ {
    proxy_pass $control_api;

    # Knowledge document uploads (POST /api/v1/knowledge-bases/{id}/documents):
    # CQ_MAX_UPLOAD_BYTES (25 MiB) plus multipart overhead, streamed to the control
    # API (which enforces the exact limit) rather than buffered here. Raise this
    # together with CQ_MAX_UPLOAD_BYTES.
    location ~ ^/api/v1/knowledge-bases/[^/]+/documents/?$ {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_pass $control_api;
    }
}

# Hashed build assets (scripts, styles, the bundled Inter font) never change.
location ^~ /assets/ {
    include /etc/nginx/cq/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/cq/security-headers.conf;
    include /etc/nginx/cq/ui-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Single-page app: unknown non-API paths (e.g. /setup) serve index.html.
location / {
    include /etc/nginx/cq/security-headers.conf;
    include /etc/nginx/cq/ui-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
