# LAN HTTPS mode: the device CA certificate (public; never the key), so a phone or laptop
# can download it and install it after checking its fingerprint against the one
# `crewquarters lan-https enable` printed. Included inside a server {} block.
location = /crewquarters-ca.crt {
    include /etc/nginx/cq/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Disposition 'attachment; filename="crewquarters-ca.crt"' always;
    types { }
    default_type application/x-x509-ca-cert;
    alias /run/crewquarters-tls/ca.crt;
}
