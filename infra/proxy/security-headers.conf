# Sent on every response from the edge (upstream copies are hidden in nginx.conf so the
# headers are never duplicated). nginx drops server-level add_header in any location that
# adds its own, so such locations include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
