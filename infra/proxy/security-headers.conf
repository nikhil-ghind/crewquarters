# Sent on every response from the edge (upstream copies are hidden in common.conf so the
# headers are never duplicated). nginx drops server-level add_header in any location that
# adds its own, so such locations include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS: sent only over HTTPS to a host name, i.e. only in LAN HTTPS mode ($cq_hsts,
# common.conf). An empty value sends no header.
add_header Strict-Transport-Security $cq_hsts always;
