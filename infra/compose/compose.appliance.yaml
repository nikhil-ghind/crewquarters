# Crewquarters appliance stack (GB10 / DGX OS). Installed by the .deb to
# /usr/share/crewquarters/compose and started by crewquarters.service:
#   docker compose -p crewquarters -f compose.appliance.yaml \
#     --env-file /etc/crewquarters/crewquarters.env --env-file /etc/crewquarters/secrets.env up -d
# Owner: Akshay Sunil Navani (Person 2).
#
# The runtime daemon runs on the host (systemd, Unix socket); these services reach it
# through the bind-mounted socket and the crewquarters group. Model-serving and agent
# containers are started by the daemon, not by Compose.
#
# Edge: the proxy is the only published port. It serves the UI, sends /api/* to the
# control API and the OAuth/Twilio callbacks to the capability broker, and answers 404 for
# /internal/* (docs/runbooks/proxy.md). Profile `callbacks` adds a Cloudflare tunnel that
# can reach only the callback paths. LAN HTTPS mode (`crewquarters lan-https enable`) adds
# the override compose.lan-https.yaml: TLS on 443 with a device CA (docs/runbooks/lan-https.md).
#
# Secrets: /etc/crewquarters/master.key (root:crewquarters 0640) is bind-mounted read-only
# into exactly two services, the capability broker and the model gateway (PLAN.md 10.2);
# they read it through the crewquarters group (CQ_SOCKET_GID, recorded by postinst).
name: crewquarters

x-image: &image
  image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform}:${CQ_VERSION:?set in crewquarters.env}
  pull_policy: missing
  restart: unless-stopped

x-platform-env: &platform-env
  CQ_PROFILE: dgx
  CQ_DATABASE_URL: postgresql+psycopg://crewquarters:${POSTGRES_PASSWORD}@postgres:5432/crewquarters
  CQ_SECRET_KEY: ${CQ_SECRET_KEY:?}
  CQ_CAPABILITY_SIGNING_KEY: ${CQ_CAPABILITY_SIGNING_KEY:?}
  CQ_INTERNAL_SERVICE_TOKEN: ${CQ_INTERNAL_SERVICE_TOKEN:?}
  CQ_PUBLIC_ORIGINS: ${CQ_PUBLIC_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
  CQ_COOKIE_SECURE: ${CQ_COOKIE_SECURE:-false}
  CQ_CATALOG_DIR: /app/catalog/dev
  CQ_RUNTIME_ADAPTER: daemon
  CQ_RUNTIME_SOCKET: /run/crewquarters/runtime.sock
  CQ_MODEL_GATEWAY_URL: http://model-gateway:8090
  CQ_BROKER_URL: http://capability-broker:8000
  CQ_KNOWLEDGE_URL: http://knowledge:8000
  CQ_CONTROL_API_URL: http://control-api:8080
  # The browser's origin: Google OAuth redirect (ADR 0009). LAN HTTPS mode sets it to
  # https://<name> in /etc/crewquarters/lan-https.env.
  CQ_PUBLIC_BASE_URL: ${CQ_PUBLIC_BASE_URL:-http://localhost:8080}
  # Twilio callbacks and signature checks: the tunnel's https:// origin. Empty: use
  # CQ_PUBLIC_BASE_URL.
  CQ_TWILIO_CALLBACK_BASE_URL: ${CQ_TWILIO_CALLBACK_BASE_URL:-}
  # Shared by the control API (upload proxy) and the knowledge service; the proxy allows
  # 26 MiB on the upload route (infra/proxy/nginx.conf).
  CQ_MAX_UPLOAD_BYTES: ${CQ_MAX_UPLOAD_BYTES:-26214400}
  CQ_CHAT_CLIENT_TOKEN: ${CQ_CHAT_CLIENT_TOKEN:?}
  CQ_PLATFORM_VERSION: ${CQ_VERSION:?set in crewquarters.env}

# Services that need the runtime daemon socket.
x-platform: &platform
  <<: *image
  group_add:
    - "${CQ_SOCKET_GID:?set by the installer}"
  volumes:
    - /run/crewquarters:/run/crewquarters
    - /usr/share/crewquarters/catalog:/usr/share/crewquarters/catalog:ro
  environment: *platform-env

x-embedding-env: &embedding-env
  CQ_EMBEDDING_MODE: ${CQ_EMBEDDING_MODE:-local}
  CQ_EMBEDDING_MODEL_DIR: /var/lib/crewquarters/embedding-models
  CQ_EMBEDDING_CACHE_DIR: /var/lib/crewquarters/embedding-models

services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: crewquarters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: crewquarters
    volumes:
      - /var/lib/crewquarters/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewquarters -d crewquarters"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    <<: *platform
    restart: "no"
    command: ["alembic", "-c", "services/control_api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    <<: *platform
    command: ["cq-api"]
    environment:
      <<: *platform-env
      CQ_API_HOST: 0.0.0.0
      # Unpublished port: only the proxy and platform services reach it.
      CQ_API_FORWARDED_ALLOW_IPS: "*"
      # Owner-triggered backups (docs/runbooks/backup-restore.md). The master key is not
      # mounted here: API backups never include it.
      CQ_DOCUMENTS_DIR: /var/lib/crewquarters/documents
      CQ_BACKUP_DIR: /var/lib/crewquarters/backups
      CQ_BACKUP_RETENTION: ${CQ_BACKUP_RETENTION:-7}
    volumes:
      - /run/crewquarters:/run/crewquarters
      - /usr/share/crewquarters/catalog:/usr/share/crewquarters/catalog:ro
      - /var/lib/crewquarters/documents:/var/lib/crewquarters/documents:ro
      - /var/lib/crewquarters/backups:/var/lib/crewquarters/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  capability-broker:
    <<: *image
    command: ["cq-broker"]
    group_add:
      - "${CQ_SOCKET_GID:?set by the installer}"
    volumes:
      - /etc/crewquarters/master.key:/run/crewquarters-keys/master.key:ro
    environment:
      <<: *platform-env
      CQ_MASTER_KEY_FILE: /run/crewquarters-keys/master.key
      CQ_PROVIDER_MODE: ${CQ_PROVIDER_MODE:-live}
      CQ_GOOGLE_CLIENT_ID: ${CQ_GOOGLE_CLIENT_ID:-}
      CQ_GOOGLE_CLIENT_SECRET: ${CQ_GOOGLE_CLIENT_SECRET:-}
      CQ_TWILIO_ALLOWED_NUMBERS: ${CQ_TWILIO_ALLOWED_NUMBERS:-[]}
      # Realtime voice calls (docs/voice-calls.md): the credential that lets the broker use
      # the gateway's audio routes, and the local models a call uses.
      CQ_VOICE_CLIENT_TOKEN: ${CQ_VOICE_CLIENT_TOKEN:?}
      CQ_VOICE_ASR_MODEL: ${CQ_VOICE_ASR_MODEL:-local.asr.r2t2}
      CQ_VOICE_LLM_PROFILE: ${CQ_VOICE_LLM_PROFILE:-local.general.small}
      CQ_VOICE_TTS_MODEL: ${CQ_VOICE_TTS_MODEL:-local.tts.voxtream}
      CQ_VOICE_MAX_CALL_SECONDS: ${CQ_VOICE_MAX_CALL_SECONDS:-300}
      CQ_GITHUB_TOKEN: ${CQ_GITHUB_TOKEN:-}
    networks:
      default: {}
      agents:
        aliases: [capability-broker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: downloads (or re-verifies) the pinned embedding model; an offline bundle
  # pre-populates the directory (crewquarters load-bundle).
  knowledge-model:
    <<: *image
    restart: "no"
    command: ["sh", "-c", "[ \"$${CQ_EMBEDDING_MODE}\" != local ] || exec cq-knowledge fetch-model"]
    group_add:
      - "${CQ_SOCKET_GID:?set by the installer}"
    environment:
      <<: *embedding-env
    volumes:
      - /var/lib/crewquarters/embedding-models:/var/lib/crewquarters/embedding-models

  knowledge:
    <<: *image
    command: ["cq-knowledge"]
    group_add:
      - "${CQ_SOCKET_GID:?set by the installer}"
    volumes:
      - /var/lib/crewquarters/documents:/var/lib/crewquarters/documents
      - /var/lib/crewquarters/embedding-models:/var/lib/crewquarters/embedding-models
    environment:
      <<: [*platform-env, *embedding-env]
      CQ_DOCUMENTS_DIR: /var/lib/crewquarters/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      knowledge-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  model-gateway:
    <<: *platform
    command: ["cq-gateway"]
    volumes:
      - /run/crewquarters:/run/crewquarters
      - /usr/share/crewquarters/catalog:/usr/share/crewquarters/catalog:ro
      - /etc/crewquarters/master.key:/run/crewquarters-keys/master.key:ro
    environment:
      <<: *platform-env
      CQ_GATEWAY_HOST: 0.0.0.0
      CQ_GATEWAY_RUNTIME: daemon
      CQ_GATEWAY_RUNTIME_SOCKET: /run/crewquarters/runtime.sock
      CQ_GATEWAY_MODEL_ADDRESSING: name
      CQ_GATEWAY_CATALOG_DIR: /usr/share/crewquarters/catalog/models
      CQ_GATEWAY_CONTROL_API_URL: http://control-api:8080
      CQ_GATEWAY_SYSTEM_RESERVE_BYTES: ${CQ_GATEWAY_SYSTEM_RESERVE_BYTES:-25769803776}
      CQ_GATEWAY_MAX_SERVING_BYTES: ${CQ_GATEWAY_MAX_SERVING_BYTES:-103079215104}
      CQ_GATEWAY_LOAD_SAFETY_MARGIN_BYTES: ${CQ_GATEWAY_LOAD_SAFETY_MARGIN_BYTES:-8589934592}
      CQ_GATEWAY_IDLE_UNLOAD_SECONDS: ${CQ_GATEWAY_IDLE_UNLOAD_SECONDS:-600}
      CQ_MASTER_KEY_FILE: /run/crewquarters-keys/master.key
      CQ_VOICE_CLIENT_TOKEN: ${CQ_VOICE_CLIENT_TOKEN:?}
    networks:
      - default
      - models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/internal/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  scheduler:
    <<: *platform
    command: ["cq-scheduler"]
    environment:
      <<: *platform-env
      CQ_SCHEDULER_METRICS_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    image: ${CQ_PROXY_IMAGE:-crewquarters/proxy}:${CQ_VERSION:?set in crewquarters.env}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${CQ_BIND_ADDRESS:-127.0.0.1}:${CQ_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, callbacks]
    depends_on:
      control-api:
        condition: service_healthy
      capability-broker:
        condition: service_healthy

  # Profile `callbacks` (PLAN.md section 14.3): only for controlled demos; stop it after.
  #   crewquarters tunnel up|down   (needs CQ_TUNNEL_TOKEN in /etc/crewquarters/secrets.env)
  tunnel:
    profiles: [callbacks]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CQ_TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [callbacks]
    depends_on:
      proxy:
        condition: service_healthy

networks:
  models:
    # Created at boot by the host runtime daemon (internal, isolated gateway mode).
    name: cq-models
    external: true
  agents:
    # Created at boot by the host runtime daemon: agent containers reach only the broker.
    name: cq-agents
    external: true
  # Proxy <-> tunnel only.
  callbacks: {}
