# LAN HTTPS mode (PLAN.md sections 10.1 and 14; docs/runbooks/lan-https.md). An override
# for compose.appliance.yaml that `crewquarters` adds, together with
# /etc/crewquarters/lan-https.env, after `crewquarters lan-https enable`:
#   docker compose -p crewquarters -f compose.appliance.yaml -f compose.lan-https.yaml \
#     --env-file crewquarters.env --env-file secrets.env --env-file lan-https.env up -d
#
# The proxy serves the UI and API over TLS on host port 443 with the device certificate
# and redirects HTTP (CQ_HTTP_PORT, 80 in this mode) to HTTPS. lan-https.env also sets
# CQ_BIND_ADDRESS (the LAN), CQ_PUBLIC_BASE_URL, CQ_PUBLIC_ORIGINS and CQ_COOKIE_SECURE=true
# for the platform services.
services:
  proxy:
    command: ["nginx", "-c", "/etc/nginx/nginx-lan-https.conf", "-g", "daemon off;"]
    ports:
      - "${CQ_BIND_ADDRESS:-0.0.0.0}:443:8443"
    # The certificate directory is root:crewquarters 0750 and server.key 0640; the proxy
    # (uid 101) reads them through the crewquarters group. The CA key is never mounted.
    group_add:
      - "${CQ_SOCKET_GID:?set by the installer}"
    volumes:
      - /etc/crewquarters/tls/server.crt:/run/crewquarters-tls/server.crt:ro
      - /etc/crewquarters/tls/server.key:/run/crewquarters-tls/server.key:ro
      - /etc/crewquarters/tls/ca.crt:/run/crewquarters-tls/ca.crt:ro
    healthcheck:
      # HTTP only redirects in this mode; check the TLS site itself (a liveness probe on
      # loopback, so the certificate is not verified: busybox wget cannot take a CA file).
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
