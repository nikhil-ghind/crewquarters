# Crewquarters Compose stack for laptops (dev profile).
#   make dev-up          core stack; model gateway uses its in-process mock backend and the
#                        scheduler uses the fake agent runtime (no Docker access needed)
#   make integration-up  adds compose.runtime.yaml: the runtime daemon in a container, so
#                        real hardened agent containers and mock model-server containers run
# The appliance uses compose.appliance.yaml from the .deb instead (Akshay Sunil Navani).
name: crewquarters

x-app-env: &app-env
  CQ_PROFILE: dev
  CQ_DATABASE_URL: postgresql+psycopg://crewquarters:crewquarters@postgres:5432/crewquarters
  CQ_SECRET_KEY: ${CQ_SECRET_KEY:-dev-insecure-secret-key-change-me-0000000000}
  CQ_CAPABILITY_SIGNING_KEY: ${CQ_CAPABILITY_SIGNING_KEY:-dev-insecure-capability-key-change-me-00000}
  CQ_INTERNAL_SERVICE_TOKEN: ${CQ_INTERNAL_SERVICE_TOKEN:-dev-insecure-internal-token-change-me-0000}
  CQ_CATALOG_DIR: /app/catalog/dev
  CQ_RUNTIME_ADAPTER: fake
  CQ_MODEL_GATEWAY_URL: http://model-gateway:8090
  CQ_CHAT_CLIENT_TOKEN: ${CQ_CHAT_CLIENT_TOKEN:-dev-insecure-chat-token-change-me-000000000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crewquarters
      POSTGRES_PASSWORD: crewquarters
      POSTGRES_DB: crewquarters
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewquarters -d crewquarters"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    image: crewquarters/platform:dev
    command: ["alembic", "-c", "services/control_api/alembic.ini", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    image: crewquarters/platform:dev
    command: ["cq-api"]
    environment:
      <<: *app-env
      CQ_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-gateway:
    image: crewquarters/platform:dev
    command: ["cq-gateway"]
    environment:
      <<: *app-env
      CQ_GATEWAY_HOST: 0.0.0.0
      CQ_GATEWAY_RUNTIME: inprocess
      CQ_GATEWAY_CONTROL_API_URL: http://control-api:8080
      CQ_GATEWAY_SYSTEM_RESERVE_BYTES: "2147483648"
      CQ_GATEWAY_MAX_SERVING_BYTES: "8589934592"
      CQ_GATEWAY_LOAD_SAFETY_MARGIN_BYTES: "1073741824"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/internal/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler:
    image: crewquarters/platform:dev
    command: ["cq-scheduler"]
    environment:
      <<: *app-env
      CQ_SCHEDULER_METRICS_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Person 5: SDK/agent development stack (profile `fake`: make fake-up) ---------------
  # The fake platform stands in for the capability broker, model gateway, knowledge service,
  # and Google/Twilio until Persons 2-3 ship them. Agent containers attach only to the
  # internal `crewq-agents` network (no route to the internet) and reach `broker`.
  fake-platform:
    profiles: [fake]
    build:
      context: ../..
      dockerfile: packages/fake_platform/Dockerfile
    image: crewquarters/fake-platform:dev
    environment:
      CREWQ_FAKE_SCENARIOS_DIR: /workspace
      CREWQ_FAKE_HEARTBEAT_SECONDS: "2"
      CREWQ_FAKE_LLM_BASE_URL: ${CREWQ_FAKE_LLM_BASE_URL:-}
      CREWQ_FAKE_LLM_MODEL: ${CREWQ_FAKE_LLM_MODEL:-}
    volumes:
      # Scenarios are read from the repository (read-only): tests/fixtures/scenarios, agents/*/scenarios.
      - ../..:/workspace:ro
    ports:
      - "127.0.0.1:8090:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      default: {}
      agents:
        aliases: [broker]

  registry:
    profiles: [fake]
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    ports:
      - "127.0.0.1:5001:5000"

networks:
  agents:
    name: crewq-agents
    internal: true

volumes:
  pgdata:
