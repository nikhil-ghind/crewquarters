# Crewquarters Compose stack for laptops (dev profile).
#   make dev-up          core stack; model gateway uses its in-process mock backend and the
#                        scheduler uses the fake agent runtime (no Docker access needed)
#   make integration-up  adds compose.runtime.yaml: the runtime daemon in a container, so
#                        real hardened agent containers and mock model-server containers run
# The appliance uses compose.appliance.yaml from the .deb instead (Akshay Sunil Navani).
#
# The proxy is the only published HTTP entry (http://127.0.0.1:${CQ_HTTP_PORT:-8080}):
# UI, /api/* -> control API, the OAuth/Twilio callbacks -> capability broker, /internal/*
# -> 404. Routing table: docs/runbooks/proxy.md. Optional profile `callbacks` adds a
# Cloudflare tunnel that reaches only the callback paths (proxy port 8081).
#
# Host ports and images are overridable so a second stack can run beside this one, e.g.
#   CQ_HTTP_PORT=18080 CQ_POSTGRES_PORT=15432 docker compose -p cqc -f ... up -d
name: crewquarters

x-app-env: &app-env
  CQ_PROFILE: dev
  CQ_DATABASE_URL: postgresql+psycopg://crewquarters:crewquarters@postgres:5432/crewquarters
  CQ_SECRET_KEY: ${CQ_SECRET_KEY:-dev-insecure-secret-key-change-me-0000000000}
  CQ_CAPABILITY_SIGNING_KEY: ${CQ_CAPABILITY_SIGNING_KEY:-dev-insecure-capability-key-change-me-00000}
  CQ_INTERNAL_SERVICE_TOKEN: ${CQ_INTERNAL_SERVICE_TOKEN:-dev-insecure-internal-token-change-me-0000}
  CQ_CATALOG_DIR: /app/catalog/dev
  CQ_RUNTIME_ADAPTER: fake
  CQ_MODEL_GATEWAY_URL: http://model-gateway:8090
  CQ_BROKER_URL: http://capability-broker:8000
  CQ_KNOWLEDGE_URL: http://knowledge:8000
  CQ_CONTROL_API_URL: http://control-api:8080
  CQ_PUBLIC_BASE_URL: ${CQ_PUBLIC_BASE_URL:-http://localhost:8080}
  # Twilio callbacks and signatures use this origin (the tunnel); Google stays on CQ_PUBLIC_BASE_URL.
  CQ_TWILIO_CALLBACK_BASE_URL: ${CQ_TWILIO_CALLBACK_BASE_URL:-}
  # Shared by the control API (upload proxy) and the knowledge service; the proxy allows
  # 26 MiB on the upload route (infra/proxy/nginx.conf).
  CQ_MAX_UPLOAD_BYTES: ${CQ_MAX_UPLOAD_BYTES:-26214400}
  CQ_CHAT_CLIENT_TOKEN: ${CQ_CHAT_CLIENT_TOKEN:-dev-insecure-chat-token-change-me-000000000}
  CQ_VOICE_CLIENT_TOKEN: ${CQ_VOICE_CLIENT_TOKEN:-dev-insecure-voice-token-change-me-00000000}

# Services that decrypt provider secrets: the device keyring, read-only, readable through
# a dedicated group (mirrors the appliance: root:crewquarters 0640 + group_add).
x-master-key: &master-key
  group_add:
    - "${CQ_KEY_GID:-10500}"
  volumes:
    - master-key:/run/crewquarters-keys:ro

x-embedding-env: &embedding-env
  CQ_EMBEDDING_MODE: ${CQ_EMBEDDING_MODE:-fake}
  CQ_EMBEDDING_MODEL_DIR: /var/lib/crewquarters/embedding-models
  CQ_EMBEDDING_CACHE_DIR: /var/lib/crewquarters/embedding-models

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crewquarters
      POSTGRES_PASSWORD: crewquarters
      POSTGRES_DB: crewquarters
    ports:
      - "127.0.0.1:${CQ_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewquarters -d crewquarters"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["alembic", "-c", "services/control_api/alembic.ini", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: a development keyring (random, generated once per volume) owned
  # root:${CQ_KEY_GID} mode 0640. Only the broker and the model gateway mount it.
  master-key:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    user: "0:0"
    environment:
      CQ_KEY_GID: ${CQ_KEY_GID:-10500}
    command:
      - python
      - -c
      - |
        import os, pathlib, secrets
        key = pathlib.Path("/keys/master.key")
        if not key.exists():
            key.write_text(f"1:{secrets.token_hex(32)}\n")
        os.chown(key, 0, int(os.environ["CQ_KEY_GID"]))
        os.chmod(key, 0o640)
        print("master key ready:", oct(key.stat().st_mode & 0o777), key.stat().st_uid, key.stat().st_gid)
    volumes:
      - master-key:/keys
    network_mode: none

  control-api:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["cq-api"]
    environment:
      <<: *app-env
      CQ_API_HOST: 0.0.0.0
      # Unpublished port: only the proxy and platform services reach it.
      CQ_API_FORWARDED_ALLOW_IPS: "*"
      # The dev stack runs the real broker (with fake providers), so read connection status from it.
      CQ_BROKER_ADAPTER: http
      # Owner-triggered backups (docs/runbooks/backup-restore.md): documents are read-only.
      CQ_DOCUMENTS_DIR: /var/lib/crewquarters/documents
      CQ_BACKUP_DIR: /var/lib/crewquarters/backups
    volumes:
      - documents:/var/lib/crewquarters/documents:ro
      - backups:/var/lib/crewquarters/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  capability-broker:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["cq-broker"]
    <<: *master-key
    environment:
      <<: *app-env
      CQ_MASTER_KEY_FILE: /run/crewquarters-keys/master.key
      CQ_PROVIDER_MODE: ${CQ_PROVIDER_MODE:-fake}
      # Placeholder OAuth client for the fake Google provider; set real values with CQ_PROVIDER_MODE=live.
      CQ_GOOGLE_CLIENT_ID: ${CQ_GOOGLE_CLIENT_ID:-crewquarters-dev.apps.example.com}
      CQ_GOOGLE_CLIENT_SECRET: ${CQ_GOOGLE_CLIENT_SECRET:-dev-client-secret}
      # Live mode only: the numbers the caller may dial (JSON list of E.164).
      CQ_TWILIO_ALLOWED_NUMBERS: ${CQ_TWILIO_ALLOWED_NUMBERS:-[]}
      # Live mode only: a GitHub token for the PR reviewer (for example `gh auth token`).
      CQ_GITHUB_TOKEN: ${CQ_GITHUB_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      master-key:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: downloads and verifies the pinned embedding model when CQ_EMBEDDING_MODE is
  # `local` (the dev default `fake` needs no model).
  knowledge-model:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["sh", "-c", "[ \"$${CQ_EMBEDDING_MODE}\" != local ] || exec cq-knowledge fetch-model"]
    environment:
      <<: *embedding-env
    volumes:
      - embedding-models:/var/lib/crewquarters/embedding-models

  knowledge:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["cq-knowledge"]
    environment:
      <<: [*app-env, *embedding-env]
      CQ_DOCUMENTS_DIR: /var/lib/crewquarters/documents
    volumes:
      - documents:/var/lib/crewquarters/documents
      - embedding-models:/var/lib/crewquarters/embedding-models
    depends_on:
      migrate:
        condition: service_completed_successfully
      knowledge-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-gateway:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["cq-gateway"]
    <<: *master-key
    environment:
      <<: *app-env
      CQ_GATEWAY_HOST: 0.0.0.0
      CQ_GATEWAY_RUNTIME: inprocess
      CQ_GATEWAY_CONTROL_API_URL: http://control-api:8080
      CQ_GATEWAY_SYSTEM_RESERVE_BYTES: "2147483648"
      CQ_GATEWAY_MAX_SERVING_BYTES: "8589934592"
      CQ_GATEWAY_LOAD_SAFETY_MARGIN_BYTES: "1073741824"
      CQ_MASTER_KEY_FILE: /run/crewquarters-keys/master.key
    depends_on:
      migrate:
        condition: service_completed_successfully
      master-key:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/internal/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler:
    image: ${CQ_PLATFORM_IMAGE:-crewquarters/platform:dev}
    command: ["cq-scheduler"]
    environment:
      <<: *app-env
      CQ_SCHEDULER_METRICS_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Edge proxy (nginx, non-root) with the web UI. The only published HTTP port.
  proxy:
    build:
      context: ../..
      dockerfile: infra/docker/proxy.Dockerfile
    image: ${CQ_PROXY_IMAGE:-crewquarters/proxy:dev}
    ports:
      # CQ_HTTP_BIND=0.0.0.0 lets other devices on the LAN reach the UI (plain HTTP; see
      # docs/runbooks/local-demo.md "Other devices"). Loopback only by default.
      - "${CQ_HTTP_BIND:-127.0.0.1}:${CQ_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, callbacks]
    depends_on:
      control-api:
        condition: service_healthy
      capability-broker:
        condition: service_healthy

  # Profile `callbacks` (PLAN.md section 14.3): a Cloudflare tunnel for controlled demos.
  # Its only upstream is the proxy's callback site (port 8081), which serves the Google
  # OAuth and Twilio callback paths and 404 for everything else. Point the tunnel's public
  # hostname at http://proxy:8081 and set CQ_TWILIO_CALLBACK_BASE_URL to https://<that
  # hostname>. Keep CQ_PUBLIC_BASE_URL at the address the browser uses (Google sign-in).
  tunnel:
    profiles: [callbacks]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CQ_TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [callbacks]
    depends_on:
      proxy:
        condition: service_healthy

  # Profile `callbacks-quick`: the same, without a Cloudflare account. cloudflared prints a
  # random https://<name>.trycloudflare.com URL (`docker compose logs tunnel-quick`); set
  # CQ_TWILIO_CALLBACK_BASE_URL to it and recreate the capability broker. The URL changes on
  # every start, so this is for tests only.
  tunnel-quick:
    profiles: [callbacks-quick]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:8081"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [callbacks]
    depends_on:
      proxy:
        condition: service_healthy

  # --- Person 5: SDK/agent development stack (profile `fake`: make fake-up) ---------------
  # The fake platform stands in for the capability broker, model gateway, knowledge service,
  # and Google/Twilio until Persons 2-3 ship them. Agent containers attach only to the
  # internal `crewq-agents` network (no route to the internet) and reach `broker`.
  fake-platform:
    profiles: [fake]
    build:
      context: ../..
      dockerfile: packages/fake_platform/Dockerfile
    image: crewquarters/fake-platform:dev
    environment:
      CREWQ_FAKE_SCENARIOS_DIR: /workspace
      CREWQ_FAKE_HEARTBEAT_SECONDS: "2"
      CREWQ_FAKE_LLM_BASE_URL: ${CREWQ_FAKE_LLM_BASE_URL:-}
      CREWQ_FAKE_LLM_MODEL: ${CREWQ_FAKE_LLM_MODEL:-}
      # Voice calls (`make voice-e2e-containers` sets the LiveKit URL): LiveKit on the agent
      # network (ws://livekit:7880), and optionally the real speech server (http://speech:8200).
      CREWQ_FAKE_LIVEKIT_URL: ${CREWQ_FAKE_LIVEKIT_URL:-}
      CREWQ_FAKE_LIVEKIT_API_URL: ${CREWQ_FAKE_LIVEKIT_API_URL:-}
      CREWQ_FAKE_LIVEKIT_API_KEY: ${CREWQ_FAKE_LIVEKIT_API_KEY:-}
      CREWQ_FAKE_LIVEKIT_API_SECRET: ${CREWQ_FAKE_LIVEKIT_API_SECRET:-}
      CREWQ_FAKE_SPEECH_URL: ${CREWQ_FAKE_SPEECH_URL:-}
      CREWQ_FAKE_SIP_TRUNK_ID: ${CREWQ_FAKE_SIP_TRUNK_ID:-}
      # A real model gateway for the facade (docs/voice/README.md), e.g. a GB10 through a tunnel.
      CREWQ_FAKE_GATEWAY_URL: ${CREWQ_FAKE_GATEWAY_URL:-}
      CREWQ_FAKE_GATEWAY_SERVICE_TOKEN: ${CREWQ_FAKE_GATEWAY_SERVICE_TOKEN:-}
      CREWQ_FAKE_GATEWAY_VOICE_TOKEN: ${CREWQ_FAKE_GATEWAY_VOICE_TOKEN:-}
    volumes:
      # Scenarios are read from the repository (read-only): tests/fixtures/scenarios, agents/*/scenarios.
      - ../..:/workspace:ro
    ports:
      - "127.0.0.1:8090:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      default: {}
      agents:
        aliases: [broker]

  registry:
    profiles: [fake]
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    ports:
      - "127.0.0.1:5001:5000"

  # --- Person 5: local voice stack (profile `voice`: make voice-up) -------------------------
  # LiveKit carries call audio; agents join a call's room with a per-room token from the
  # broker. CREWQ_LIVEKIT_MODE picks the media address (infra/livekit/livekit.<mode>.yaml):
  # `host` for host processes (laptop development), `containers` for hardened agent
  # containers on crewq-agents, `sip` for a real trunk (adds Redis and livekit-sip).
  livekit:
    profiles: [voice]
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../livekit/livekit.${CREWQ_LIVEKIT_MODE:-host}.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      default: {}
      agents:
        ipv4_address: 10.231.72.10
        aliases: [livekit]

  # OpenAI-compatible speech-to-text (Parakeet) and speech (Kokoro) for local.stt.* and
  # local.tts.*. Models live in the speech-models volume: `make speech-models` fills it once.
  speech:
    profiles: [voice]
    build:
      context: ../..
      dockerfile: packages/speech_server/Dockerfile
    image: crewquarters/speech:dev
    environment:
      CREWQ_SPEECH_ENGINE: sherpa
      CREWQ_SPEECH_THREADS: ${CREWQ_SPEECH_THREADS:-4}
    volumes:
      - speech-models:/models
    ports:
      - "127.0.0.1:8200:8200"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      default: {}
      agents:
        aliases: [speech]

  # Real phone numbers through a SIP trunk (profile `sip`; see docs/voice/README.md).
  redis:
    profiles: [sip]
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs: [/data]
    networks: [agents]

  livekit-sip:
    profiles: [sip]
    image: livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
    volumes:
      - ../livekit/sip.yaml:/etc/sip.yaml:ro
    # SIP signalling and RTP media must reach the trunk provider: publish them on the GB10's
    # LAN address and forward them on the router (docs/voice/README.md).
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    networks:
      default: {}
      agents: {}

networks:
  agents:
    name: crewq-agents
    internal: true
    ipam:
      config:
        - subnet: 10.231.72.0/24
  # Proxy <-> tunnel only. The tunnel cannot reach the control API, broker or database.
  callbacks: {}

volumes:
  pgdata:
  master-key:
  documents:
  embedding-models:
  backups:
  speech-models:
