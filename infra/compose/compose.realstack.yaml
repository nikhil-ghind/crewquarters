# Real-stack E2E override (docs/testing-realstack.md): layered on compose.yaml and
# compose.runtime.yaml, under its own project name, ports, images and Docker networks, so it
# runs beside a developer's stack without sharing anything with it.
#
#   make realstack-up      images, local registry, agent images pinned by digest, stack
#   make realstack-test    pytest -m realstack tests/realstack (through the proxy only)
#   make realstack-down    removes this project's containers, volumes, networks and data
#
# Ports, images and the public URL come from infra/compose/realstack.env (--env-file), because
# Compose appends `ports:` from an override instead of replacing them.
#
# What differs from `make integration-up`, and why:
# - The runtime daemon creates `cqreal-agents` / `cqreal-models` instead of the shared
#   `cq-agents` / `cq-models`. Two stacks on one engine would otherwise both join
#   `cq-agents` with the alias `capability-broker`, and an agent could resolve the other
#   stack's broker.
# - The model gateway uses its in-process mock backend (no model containers, whose fixed
#   names `cq-model-*` would collide with another stack's).
# - The control API and scheduler load the catalog generated by tests/realstack/prepare.py
#   (bundled hello-crew plus the three agents pinned to the digests just pushed).
# - The capability broker runs through tests/realstack/harness/broker_entry.py: the same
#   application and the same built-in fake Google/Twilio (CQ_PROVIDER_MODE=fake), plus
#   (1) fake Twilio that delivers its callbacks as signed HTTP requests through the proxy,
#   (2) fault knobs and sheet seeding on /__realstack/* (admin token; published on
#   127.0.0.1 only). DEVELOPMENT/TEST ONLY.
# - Shorter heartbeat and prepare timeouts, so failure injection finishes in seconds.
x-realstack-timeouts: &realstack-timeouts
  CQ_HEARTBEAT_TIMEOUT_SECONDS: "15"
  CQ_PREPARE_TIMEOUT_SECONDS: "120"

services:
  realstack-registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    ports:
      - "127.0.0.1:${CQ_REALSTACK_REGISTRY_PORT:-15001}:5000"

  runtime-daemon:
    environment:
      CQ_RUNTIME_AGENT_NETWORK: cqreal-agents
      CQ_RUNTIME_MODEL_NETWORK: cqreal-models

  control-api:
    environment:
      <<: *realstack-timeouts
      CQ_CATALOG_DIR: /realstack/catalog
    volumes:
      - ../../tests/realstack/.generated/catalog:/realstack/catalog:ro

  scheduler:
    environment:
      <<: *realstack-timeouts
      CQ_CATALOG_DIR: /realstack/catalog
    volumes:
      - ../../tests/realstack/.generated/catalog:/realstack/catalog:ro

  model-gateway:
    environment:
      CQ_GATEWAY_RUNTIME: inprocess

  capability-broker:
    command: ["python", "/realstack/harness/broker_entry.py"]
    environment:
      <<: *realstack-timeouts
      CQ_PROVIDER_MODE: fake
      REALSTACK_ADMIN_TOKEN: ${CQ_REALSTACK_ADMIN_TOKEN:-realstack-admin-token-0000000000}
      # Where fake Twilio delivers callbacks: the proxy, like Twilio reaching the public URL.
      REALSTACK_CALLBACK_BASE: http://proxy:8080
    volumes:
      - ../../tests/realstack/harness:/realstack/harness:ro
    ports:
      - "127.0.0.1:${CQ_REALSTACK_BROKER_ADMIN_PORT:-18084}:8000"

networks:
  models:
    name: cqreal-models
    external: true
  run-agents:
    name: cqreal-agents
    external: true
