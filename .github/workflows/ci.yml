name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/shared_python/src services/control_api/src services/scheduler/src

  platform-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crewquarters
          POSTGRES_PASSWORD: crewquarters
          POSTGRES_DB: crewquarters
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U crewquarters" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q --cov --cov-report=term --cov-report=json
        env:
          CQ_TEST_ADMIN_URL: postgresql+psycopg://crewquarters:crewquarters@127.0.0.1:55432/crewquarters
      - name: Coverage thresholds on security/state modules
        run: uv run python infra/scripts/check_coverage.py coverage.json

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --python 3.12
      - name: Regenerate OpenAPI and clients; fail on drift
        run: make contracts-check

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: crewquarters/platform:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test (emulated on arm64)
        run: |
          docker run --rm --platform ${{ matrix.platform }} crewquarters/platform:ci \
            python -c "import platform, crewquarters_api.main, crewquarters_scheduler.main; print(platform.machine())"
          docker run --rm --platform ${{ matrix.platform }} crewquarters/platform:ci cq-admin --help
      - name: SBOM (SPDX)
        if: matrix.platform == 'linux/amd64'
        uses: anchore/sbom-action@v0
        with:
          image: crewquarters/platform:ci
          format: spdx-json
          artifact-name: platform-sbom.spdx.json
      - name: Vulnerability scan (fail on fixable critical)
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: crewquarters/platform:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
