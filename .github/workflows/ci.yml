name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12 --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy packages/shared_python/src services/control_api/src services/scheduler/src
          services/model_gateway/src services/runtime_daemon/src
          packages/secret_store/src services/capability_broker/src services/knowledge/src
          packages/python_sdk/src packages/fake_platform/src packages/crewctl/src
          agents/contract_probe/src agents/gmail_digest/src agents/caller/src
          packages/speech_server/src
      - name: Third-party license inventory is up to date (PLAN.md 23.1)
        run: uv run python infra/scripts/license_inventory.py --check

  platform-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crewquarters
          POSTGRES_PASSWORD: crewquarters
          POSTGRES_DB: crewquarters
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U crewquarters" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12 --all-packages
      - run: uv run pytest -q --cov --cov-report=term --cov-report=json
        env:
          CQ_TEST_ADMIN_URL: postgresql+psycopg://crewquarters:crewquarters@127.0.0.1:55432/crewquarters
      - name: Coverage thresholds on security/state modules
        run: uv run python infra/scripts/check_coverage.py coverage.json

  runtime-daemon-py310:
    # The daemon runs on the DGX OS host (Ubuntu 22.04, Python 3.10) from the .deb.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - name: Daemon tests on Python 3.10 against the runner's Docker engine
        run: >-
          PYTHONPATH=services/runtime_daemon/src uv run --python 3.10 --isolated --no-project
          --with pytest --with pytest-asyncio --with httpx
          pytest -q --noconftest -p no:cacheprovider services/runtime_daemon/tests

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb packages
        run: |
          infra/debian/build-deb.sh "0.1.0+${GITHUB_SHA::7}" arm64
          infra/debian/build-deb.sh "0.1.0+${GITHUB_SHA::7}" amd64
          mv dist/crewquarters_*_amd64.deb dist/crewquarters_0.1.0_amd64.deb
      - name: License inventory and NOTICE are in the package
        run: |
          dpkg-deb -c dist/crewquarters_0.1.0_amd64.deb | grep -q usr/share/doc/crewquarters/THIRD_PARTY_LICENSES.md
          dpkg-deb -c dist/crewquarters_0.1.0_amd64.deb | grep -q usr/share/doc/crewquarters/NOTICE
          dpkg-deb -c dist/crewquarters_0.1.0_amd64.deb | grep -q usr/share/doc/crewquarters/LICENSE
      - name: Secret scan of the built packages (fails on findings)
        run: infra/scripts/scan_secrets.sh dist/*.deb
      - name: Install, reinstall, remove, purge in ubuntu:22.04
        run: |
          docker run --rm -v "$PWD/dist:/pkgs:ro" -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/infra/debian/test-install.sh:/t.sh:ro" ubuntu:22.04 bash /t.sh
      - name: Verify systemd units
        run: systemd-analyze verify --man=no infra/systemd/*.service infra/systemd/*.socket || true
      - name: Validate Compose files
        run: |
          docker compose -f infra/compose/compose.yaml config -q
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.runtime.yaml config -q
          docker compose -f infra/compose/compose.yaml --profile callbacks --profile fake config -q
          export CQ_VERSION=0 CQ_SOCKET_GID=1 POSTGRES_PASSWORD=x CQ_SECRET_KEY=x \
            CQ_CAPABILITY_SIGNING_KEY=x CQ_INTERNAL_SERVICE_TOKEN=x CQ_CHAT_CLIENT_TOKEN=x
          docker compose -f infra/compose/compose.appliance.yaml config -q
          docker compose -f infra/compose/compose.appliance.yaml --profile callbacks config -q
          docker compose -f infra/compose/compose.appliance.yaml -f infra/compose/compose.lan-https.yaml config -q
          docker compose -f infra/compose/compose.yaml --profile callbacks-quick config -q
          # Only the proxy publishes a port, and only two services get the master key.
          test "$(docker compose -f infra/compose/compose.appliance.yaml config --format json \
            | jq -r '[.services | to_entries[] | select(.value.ports) | .key] | join(",")')" = proxy
          test "$(docker compose -f infra/compose/compose.appliance.yaml config --format json \
            | jq -r '[.services | to_entries[] | select(any(.value.volumes[]?; .source == "/etc/crewquarters/master.key")) | .key] | sort | join(",")')" \
            = capability-broker,model-gateway
      - name: Proxy config and routing
        run: |
          docker build -f infra/docker/proxy.Dockerfile -t crewquarters/proxy:ci .
          docker run --rm crewquarters/proxy:ci nginx -t
          infra/proxy/test-proxy.sh crewquarters/proxy:ci
      - uses: actions/upload-artifact@v4
        with:
          name: crewquarters-deb
          path: dist/crewquarters_*_arm64.deb

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --python 3.12
      - name: Regenerate OpenAPI and clients; fail on drift
        run: make contracts-check

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: crewquarters/platform:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Build proxy image (nginx + web UI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/proxy.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: crewquarters/proxy:ci
          cache-from: type=gha,scope=proxy-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=proxy-${{ matrix.platform }}
      - name: Smoke test (emulated on arm64)
        run: |
          docker run --rm --platform ${{ matrix.platform }} crewquarters/platform:ci \
            python -c "import platform, crewquarters_api.main, crewquarters_scheduler.main; print(platform.machine())"
          docker run --rm --platform ${{ matrix.platform }} crewquarters/platform:ci cq-admin --help
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh crewquarters/proxy:ci \
            -c 'test -f /usr/share/crewquarters/ui/index.html && ls /usr/share/crewquarters/ui/assets/*.js >/dev/null'
      - name: SBOM (SPDX)
        if: matrix.platform == 'linux/amd64'
        uses: anchore/sbom-action@v0.24.2
        with:
          image: crewquarters/platform:ci
          format: spdx-json
          artifact-name: platform-sbom.spdx.json
      - name: Vulnerability scan (fail on fixable critical)
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crewquarters/platform:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # --- Person 5: agents in hardened containers against the fake platform --------------------
  agent-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12 --all-packages
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - run: make fake-up
      - run: make e2e
      - if: failure()
        run: docker compose -f infra/compose/compose.yaml --profile fake logs fake-platform

  # Real agent images through the real stack: control API, scheduler, containerized runtime
  # daemon, capability broker (fake Google/Twilio), model gateway, knowledge service, proxy.
  # docs/testing-realstack.md
  realstack-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12 --all-packages
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - run: make realstack-up
      - run: make realstack-test
      - if: failure()
        run: |
          docker compose -p cqreal --env-file infra/compose/realstack.env -f infra/compose/compose.yaml \
            -f infra/compose/compose.runtime.yaml -f infra/compose/compose.realstack.yaml logs --no-color --tail 300
      - if: always()
        run: make realstack-down

  agent-images-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 agent and fake-platform images; self-check under emulation
        run: |
          for agent in contract_probe gmail_digest caller; do
            docker buildx build --platform linux/arm64 -f agents/$agent/Dockerfile -t crewq/$agent:arm64 --load .
            docker run --rm --platform linux/arm64 --network none crewq/$agent:arm64 --self-check
          done
          docker buildx build --platform linux/arm64 -f packages/fake_platform/Dockerfile -t crewq/fake-platform:arm64 --load .
          docker run --rm --platform linux/arm64 crewq/fake-platform:arm64 --help

  # --- Person 4: web UI (apps/web) ---------------------------------------------------------
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.yaml
        run: npm run gen:api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: No provider/model/internal hosts in the bundle
        run: npm run check:bundle
      - name: Secret scan of the built UI (fails on findings)
        run: ../../infra/scripts/scan_secrets.sh dist
      - name: Unit and component tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright against the mocked API (flows, reconnect, degraded, axe, responsive)
        run: npx playwright test
        env:
          CI: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14

  # --- Release security checks (PLAN.md 16.2, 23.6; docs/security/release-checklist.md) -----

  fuzz:
    # Fuzz and limit tests: manifests, config schemas, run events/redaction, cron, capability
    # tokens, A1 ranges, Twilio callbacks, document extraction, Gmail MIME, API body limits.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crewquarters
          POSTGRES_PASSWORD: crewquarters
          POSTGRES_DB: crewquarters
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U crewquarters" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12 --all-packages
      - name: Hypothesis properties (bounded, derandomized budget)
        run: uv run pytest -q -p no:cacheprovider tests/fuzz
        env:
          CQ_TEST_ADMIN_URL: postgresql+psycopg://crewquarters:crewquarters@127.0.0.1:55432/crewquarters
          CQ_FUZZ_EXAMPLES: "150"

  dependency-scan:
    # uv.lock and apps/web/package-lock.json (all groups, dev included): fail on fixable
    # CRITICAL, report HIGH. Image contents are scanned per image in `image-security`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: infra/scripts/trivyignore
      - name: Lockfile vulnerability report (HIGH, not blocking)
        if: always()
        run: >-
          trivy fs --quiet --scanners vuln --severity HIGH,CRITICAL
          --ignorefile infra/scripts/trivyignore . | tee -a "$GITHUB_STEP_SUMMARY"

  image-security:
    # Every shipped image on both architectures: SPDX SBOM, Trivy (fail on fixable CRITICAL,
    # report HIGH), non-root and setuid checks, and a secret scan of the filesystem. Each image
    # is built once into a docker archive; nothing is run, so arm64 is scanned without QEMU
    # execution (QEMU is only needed for the RUN steps of the build, cached from `images`).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [platform, proxy, contract_probe, gmail_digest, caller]
        arch: [amd64, arm64]
        include:
          - image: platform
            dockerfile: infra/docker/python.Dockerfile
            cache: ""
          - image: proxy
            dockerfile: infra/docker/proxy.Dockerfile
            cache: proxy-
          - image: contract_probe
            dockerfile: agents/contract_probe/Dockerfile
            cache: agent-contract_probe-
            write-cache: true
          - image: gmail_digest
            dockerfile: agents/gmail_digest/Dockerfile
            cache: agent-gmail_digest-
            write-cache: true
          - image: caller
            dockerfile: agents/caller/Dockerfile
            cache: agent-caller-
            write-cache: true
    env:
      NAME: ${{ matrix.image }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (linux/${{ matrix.arch }}) into an image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          tags: crewquarters/${{ matrix.image }}:ci-${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          provenance: false
          # Platform and proxy reuse the cache the `images` job writes (same scopes).
          cache-from: type=gha,scope=${{ matrix.cache }}linux/${{ matrix.arch }}
          cache-to: ${{ matrix.write-cache && format('type=gha,mode=max,scope={0}linux/{1}', matrix.cache, matrix.arch) || '' }}
      - name: Runs as non-root; no setuid/setgid files beyond the allowlist
        run: python3 infra/scripts/check_image.py "$RUNNER_TEMP/image.tar"
      - uses: anchore/sbom-action/download-syft@v0.24.2
        id: syft
      - name: SBOM (SPDX JSON)
        run: >-
          ${{ steps.syft.outputs.cmd }} "docker-archive:$RUNNER_TEMP/image.tar"
          -o "spdx-json=sbom-$NAME.spdx.json"
      - name: Vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: infra/scripts/trivyignore
      - name: Vulnerability report (HIGH and CRITICAL, not blocking)
        if: always()
        run: |
          trivy image --quiet --input "$RUNNER_TEMP/image.tar" --scanners vuln \
            --severity HIGH,CRITICAL --ignorefile infra/scripts/trivyignore \
            --format json --output "trivy-$NAME.json"
          {
            echo "### $NAME"
            jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | .[]
              | "- \(.[0].Severity): \(length) (\(map(select(.FixedVersion != null and .FixedVersion != "")) | length) fixable)"' \
              "trivy-$NAME.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Secret scan of the image filesystem (fails on findings)
        if: always()
        run: infra/scripts/scan_secrets.sh --image "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security-${{ env.NAME }}
          path: |
            sbom-${{ env.NAME }}.spdx.json
            trivy-${{ env.NAME }}.json
          if-no-files-found: warn
          retention-days: 90

  release-refs:
    # PLAN.md 16.2: no mutable image tags in release manifests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv sync --frozen --python 3.12
      - name: Image references (development build, tags are warnings)
        run: uv run python infra/scripts/check_release_refs.py --mode dev
      - name: Release mode rejects tag-only references and accepts digests (self-test)
        run: |
          if uv run python infra/scripts/check_release_refs.py --mode release --skip-dockerfiles; then
            echo "release mode accepted tag-only references" && exit 1
          fi
          printf 'CQ_VERSION=0.1.0@sha256:%064d\n' 0 > "$RUNNER_TEMP/release.env"
          uv run python infra/scripts/check_release_refs.py --mode release --skip-dockerfiles \
            --env-file "$RUNNER_TEMP/release.env"
      - name: Release build - every reference pinned by digest
        if: startsWith(github.ref, 'refs/tags/v')
        # The release pipeline writes release.env with CQ_VERSION=<version>@sha256:<digest>
        # (and the proxy/platform image names) before tagging.
        run: uv run python infra/scripts/check_release_refs.py --mode release --env-file release.env

  offline-bundle-secrets:
    # Builds the amd64 offline bundle and secret-scans its manifest, SBOMs, and .deb. Heavy
    # (pulls PostgreSQL and the embedding model), so it runs on main and tags, not on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          platforms: linux/amd64
          load: true
          tags: crewquarters/platform:0.1.0-ci
          cache-from: type=gha,scope=linux/amd64
      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/proxy.Dockerfile
          platforms: linux/amd64
          load: true
          tags: crewquarters/proxy:0.1.0-ci
          cache-from: type=gha,scope=proxy-linux/amd64
      - uses: anchore/sbom-action/download-syft@v0.24.2
      - run: infra/debian/build-offline-bundle.sh 0.1.0-ci amd64
      - name: Secret scan of the bundle manifest, SBOMs, and package (fails on findings)
        run: infra/scripts/scan_secrets.sh dist/crewquarters-offline_0.1.0-ci_amd64.tar.zst
