[project]
name = "crewquarters-runtime"
version = "0.1.0"
description = "Crewquarters host runtime daemon: the only component with Docker access"
# Runs directly on DGX OS (Ubuntu 22.04, Python 3.10). Standard library only, so the
# arm64 .deb needs no native wheels.
requires-python = ">=3.10"
dependencies = []

[project.scripts]
crewquarters-runtime = "crewquarters_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_runtime"]
