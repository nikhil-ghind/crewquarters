[project]
name = "crewquarters-knowledge"
version = "0.1.0"
description = "Crewquarters knowledge service: document ingestion, local embeddings, pgvector retrieval"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewquarters-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "fastembed>=0.8,<0.9",
]

[project.scripts]
cq-knowledge = "crewquarters_knowledge.main:run"

[tool.uv.sources]
crewquarters-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_knowledge"]
