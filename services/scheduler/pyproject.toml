[project]
name = "crewquarters-scheduler"
version = "0.1.0"
description = "Crewquarters scheduler, job worker, and run reconciler"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["crewquarters-shared"]

[project.scripts]
cq-scheduler = "crewquarters_scheduler.main:main"

[tool.uv.sources]
crewquarters-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_scheduler"]
