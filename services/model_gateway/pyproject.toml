[project]
name = "crewquarters-gateway"
version = "0.1.0"
description = "Crewquarters model gateway: model catalog, leases, admission control, LLM routing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewquarters-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.70",
]

[project.scripts]
cq-gateway = "crewquarters_gateway.main:run"

[tool.uv.sources]
crewquarters-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_gateway"]
