[project]
name = "crewquarters-capability-broker"
version = "0.1.0"
description = "Crewquarters capability broker: agent capability checks, Google and Twilio adapters"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewquarters-shared",
    "crewquarters-secret-store",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.scripts]
cq-broker = "crewquarters_broker.main:run"

[tool.uv.sources]
crewquarters-shared = { workspace = true }
crewquarters-secret-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewquarters_broker"]
