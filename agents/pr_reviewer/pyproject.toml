[project]
name = "crewquarters-agent-pr-reviewer"
version = "0.1.0"
description = "Pull-request reviewer agent: comments on code style and likely bugs in the latest open PRs"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["crewquarters-sdk"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[tool.uv.sources]
crewquarters-sdk = { workspace = true }
