# Three pull requests: one with a likely bug and a swallowed exception, one with a style
# problem, and a draft. All names are synthetic.
name: pr-reviewer-default
connections:
  github: connected
github:
  pulls:
    - number: 101
      title: Speed up cart total
      author: dev-a
      draft: false
      sha: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
      updatedAt: "2026-09-24T09:00:00Z"
      files:
        - filename: shop/cart.py
          patch: |
            @@ -10,7 +10,9 @@ def total(items):
                 result = 0
            -    for item in items:
            +    for i in range(len(items) - 1):
            +        item = items[i]
                     result += item.price
            +    try:
            +        save(result)
            +    except:
            +        pass
                 return result
        - filename: uv.lock
          patch: |
            @@ -1,2 +1,2 @@
            -version = 1
            +version = 2
    - number: 102
      title: Add user name helper
      author: dev-b
      draft: false
      sha: b2c3d4e5f60718293a4b5c6d7e8f901234567890
      updatedAt: "2026-09-23T09:00:00Z"
      files:
        - filename: shop/users.py
          patch: |
            @@ -1,3 +1,5 @@
             import os
            +def GetName( user ):
            +    return user['name']
             
    - number: 103
      title: "WIP: refactor checkout"
      author: dev-c
      draft: true
      sha: c3d4e5f60718293a4b5c6d7e8f90123456789012
      updatedAt: "2026-09-22T09:00:00Z"
      files: []
llm:
  rules:
    - name: pr-review
      match: {schemaTitle: ReviewBatch}
      respond:
        perEvidence:
          arrayField: files
          item: {ref: "{ref}", findings: []}
          overrides:
            - when: {contains: ["except:"]}
              set:
                findings:
                  - {line: 11, category: bug, severity: high,
                     comment: "range(len(items) - 1) skips the last item, so the total is too small.",
                     suggestion: "Iterate over items directly."}
                  - {line: 16, category: bug, severity: medium,
                     comment: "A bare except swallows every error, so a failed save goes unnoticed.",
                     suggestion: "Catch the specific exception and log it."}
                  - {line: 99, category: bug, severity: low, comment: "Points outside the diff."}
            - when: {contains: ["GetName"]}
              set:
                findings:
                  - {line: 2, category: style, severity: low,
                     comment: "Function names should be snake_case (get_name) and have no space inside the parentheses."}
