[project]
name = "crewquarters-agent-gmail-digest"
version = "0.1.0"
description = "Daily Gmail digest agent: previous-day messages grouped into urgent, important, and low priority"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["crewquarters-sdk", "tzdata>=2024.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_digest"]

[tool.uv.sources]
crewquarters-sdk = { workspace = true }
