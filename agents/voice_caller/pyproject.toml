[project]
name = "crewquarters-agent-voice-caller"
version = "0.1.0"
description = "Voice call center agent: live outbound conversations over a local LiveKit server with local speech and LLM models"
requires-python = ">=3.12"
dependencies = [
    "crewquarters-sdk",
    # Reuses the caller agent's contact-row and consent rules, so both agents decide the same way.
    "crewquarters-agent-caller",
    "livekit-agents[openai,silero,turn-detector]==1.8.3",
    "livekit==1.1.18",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_caller"]

[tool.uv.sources]
crewquarters-sdk = { workspace = true }
crewquarters-agent-caller = { workspace = true }
