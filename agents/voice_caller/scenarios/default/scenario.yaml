# Three contacts: one conversation, one voicemail, one busy line; one row without consent.
# Needs a local LiveKit server for the conversation (make voice-up); without one, calls fail
# with NO_MEDIA_SERVER and the run still records every row.
name: voice-default
timezone: UTC
inputs:
  autoAnswers:
    - keyPattern: "confirm-voice-calls-v1:*"
      value: {choice: approve}
sheets:
  spreadsheets:
    voice-sheet:
      Contacts:
        - [name, phone_e164, consent, status]
        - [Asha Rao, "+15555550101", "yes", ""]
        - [Ben Ortiz, "+15555550102", "yes", ""]
        - [Chen Li, "+15555550103", "yes", ""]
        - [Dee Park, "+15555550104", "no", ""]
      Results: []
voice:
  callees:
    "+15555550101":
      outcome: answer
      ringSeconds: 1
      script:
        - "Hello?"
        - "Yes, I have a minute."
        - "Tuesday at three still works for me."
        - "No questions, thanks. Bye."
    "+15555550102": {outcome: voicemail, ringSeconds: 2}
    "+15555550103": {outcome: busy, ringSeconds: 1}
llm:
  rules:
    - name: outcome
      match: {schemaTitle: CallOutcome}
      respond:
        json: {disposition: completed, interest: high, callback_requested: false, follow_up: "", notes: "Confirmed Tuesday at three."}
    - name: agreed
      match: {lastUser: true, contains: ["minute"]}
      respond: {text: "Great, thanks. Does your cleaning next Tuesday at three still work for you?"}
    - name: confirmed
      match: {lastUser: true, contains: ["works"]}
      respond: {text: "Perfect, you're all set. Any questions for the dentist?"}
    - name: goodbye
      match: {lastUser: true, contains: ["bye"]}
      respond: {text: "Thanks, have a great day.", toolCall: {name: end_call, arguments: {}}}
    - name: hello
      match: {lastUser: true, contains: ["hello"]}
      respond: {text: "Hi! Do you have a quick minute?"}
