[project]
name = "crewquarters-workspace"
version = "0.1.0"
description = "Crewquarters monorepo workspace"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# The platform image installs only these (infra/docker/python.Dockerfile). Everything else in
# the workspace (SDK, crewctl, fake platform, agents) is installed with `uv sync --all-packages`.
dependencies = [
    "crewquarters-shared",
    "crewquarters-control-api",
    "crewquarters-scheduler",
    "crewquarters-runtime",
    "crewquarters-gateway",
    "crewquarters-secret-store",
    "crewquarters-capability-broker",
    "crewquarters-knowledge",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/shared_python",
    "services/control_api",
    "services/scheduler",
    "services/runtime_daemon",
    "services/model_gateway",
    "packages/secret_store",
    "services/capability_broker",
    "services/knowledge",
    "packages/python_sdk",
    "packages/fake_platform",
    "packages/crewctl",
    "agents/contract_probe",
    "agents/gmail_digest",
    "agents/caller",
    "agents/personal_space",
]

[tool.uv.sources]
crewquarters-shared = { workspace = true }
crewquarters-control-api = { workspace = true }
crewquarters-scheduler = { workspace = true }
crewquarters-runtime = { workspace = true }
crewquarters-gateway = { workspace = true }
crewquarters-secret-store = { workspace = true }
crewquarters-capability-broker = { workspace = true }
crewquarters-knowledge = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "openapi-spec-validator>=0.7",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "packages/contracts/clients",
    "services/control_api/migrations/versions",
    "catalog",  # bundled model files are pinned by SHA-256
    ".superpowers",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "UP046"]  # UP046: keep Generic[T] for pydantic models

[tool.ruff.lint.isort]
known-first-party = [
    "crewquarters_shared",
    "crewquarters_api",
    "crewquarters_scheduler",
    "crewquarters_runtime",
    "crewquarters_gateway",
    "crewquarters_secret_store",
    "crewquarters_broker",
    "crewquarters_knowledge",
    "conftest",
    "crewquarters",
    "crewctl",
    "crewquarters_fake",
    "contract_probe",
    "gmail_digest",
    "caller_agent",
    "personal_space",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "S603", "S607", "E501"]
"**/migrations/**" = ["E501"]
# Dev tooling that shells out to docker/python by design (argument lists, never a shell).
"packages/fake_platform/src/crewquarters_fake/launcher.py" = ["S603", "S607"]
"packages/crewctl/src/crewctl/build.py" = ["S603", "S607"]
"infra/scripts/evidence_report.py" = ["S603", "S607"]
"tests/e2e/**" = ["S603", "S607"]
# The classification prompt is model input; wrapping it would change what the model sees.
"agents/gmail_digest/src/gmail_digest/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
# importlib mode lets test modules share basenames across packages; pythonpath keeps
# `from conftest import ...` working for the control-plane tests. "." must stay first so that
# `conftest` is the root one; the other entries hold test-helper modules (fakebroker,
# fake_helpers, agent_runs, openapi_check, gateway_helpers). Never insert test directories into sys.path.
addopts = "--import-mode=importlib -ra"
pythonpath = [
    ".",
    "packages/python_sdk/tests",
    "packages/fake_platform/tests",
    "tests/integration",
    "tests/contract",
    "services/model_gateway/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "no_db: test does not need the database",
    "docker: test needs a local Docker engine",
    "e2e: requires the fake Docker stack (make fake-up) and pushed agent images",
    "live: requires a real Crewquarters platform and CREWQ_LIVE_* settings",
    "realstack: real agent images through the real stack (make realstack-up; tests/realstack)",
]
testpaths = [
    "packages/shared_python/tests",
    "services/control_api/tests",
    "services/scheduler/tests",
    "services/runtime_daemon/tests",
    "services/model_gateway/tests",
    "packages/secret_store/tests",
    "services/capability_broker/tests",
    "services/knowledge/tests",
    "tests/contract",
    "tests/integration",
    "tests/stack",
    "packages/python_sdk/tests",
    "packages/fake_platform/tests",
    "packages/crewctl/tests",
    "agents",
    "tests/e2e",
    "tests/live",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = [
    "crewquarters_shared",
    "crewquarters_api",
    "crewquarters_scheduler",
    "crewquarters_runtime",
    "crewquarters_gateway",
    "crewquarters_secret_store",
    "crewquarters_broker",
    "crewquarters_knowledge",
]
omit = [
    "*/crewquarters_api/admin.py",
    "*/crewquarters_scheduler/main.py",
    "*/crewquarters_api/main.py",
    "*/crewquarters_runtime/cli.py",  # exercised by the .deb install test and socket activation
]
